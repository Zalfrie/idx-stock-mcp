# Claude merespons saat disebut @claude di issue atau PR.
#
# Hanya pengguna dengan akses tulis ke repo yang bisa memicu Claude (default dari action),
# sehingga orang luar tidak bisa memakai kuota Claude Anda atau menyuruhnya mengubah kode.
#
# Setup (sekali saja):
#   1. Pasang Claude GitHub App: https://github.com/apps/claude
#   2. Tambahkan secret repo (Settings → Secrets and variables → Actions):
#        - CLAUDE_CODE_OAUTH_TOKEN  (langganan Claude Pro/Max; buat dengan `claude setup-token`)
#      ATAU, jika memakai API key dari Claude Console:
#        - ANTHROPIC_API_KEY, lalu ganti baris `claude_code_oauth_token` di bawah dengan
#          `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`
#
# Dokumentasi: https://code.claude.com/docs/en/github-actions

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# Satu run per issue/PR; permintaan baru menunggu yang sebelumnya selesai.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Jangan menyalakan runner kalau tidak ada @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Batasi iterasi agar biaya terkendali, dan izinkan Claude menjalankan build/test.
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(npm run build),Bash(npm test),Bash(npm ci),Bash(git diff:*),Bash(git status)"
